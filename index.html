<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AUX</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
  <div class="logo">AUX<span>.fm</span></div>
  <div class="view-toggle">
    <button class="toggle-opt active" id="sampleModeBtn">SAMPLE</button>
    <button class="toggle-opt" id="djModeBtn">DJ</button>
  </div>
  <div class="header-right">
    <button class="edit-mode-btn" id="editModeBtn">✏️ EDIT</button>
    <div class="status-dot" id="statusDot"></div>
  </div>
</div>

<div class="config">
  <div class="url-row">
    <input class="url-input" id="urlInput" type="text"
      placeholder="https://www.youtube.com/watch?v=..."
      autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="load-btn" id="loadBtn">LOAD</button>
  </div>
  <div class="params-row sampler-only">
    <div class="param-group">
      <div class="param-label">PADS</div>
      <div class="param-value" id="padCountVal">8</div>
      <div class="param-controls">
        <button class="param-btn" id="padMinus4">−4</button>
        <button class="param-btn" id="padMinus1">−</button>
        <button class="param-btn" id="padPlus1">+</button>
        <button class="param-btn" id="padPlus4">+4</button>
      </div>
    </div>
  </div>
  <div class="duration-row sampler-only">
    <span class="duration-label">PAD DUR</span>
    <input type="range" id="durSlider" min="0.5" max="8" step="0.5" value="2">
    <span class="duration-val" id="durVal">2s</span>
  </div>
  <div class="session-row">
    <button class="session-btn" id="importBtn">↑ IMPORT</button>
    <button class="session-btn" id="exportBtn">↓ EXPORT</button>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none">

<div class="info-bar">
  <div class="song-title" id="songTitle">Paste a YouTube URL and hit LOAD</div>
  <div class="duration-badge" id="totalDur" style="display:none"></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="edit-hint" id="editHint">✏️ TAP ANY PAD TO MOVE ITS SAMPLE POINT</div>

<!-- SAMPLER VIEW -->
<div class="pad-zone" id="padZone">
  <div class="pad-grid grid-4" id="padGrid"></div>
  <div class="transport">
    <button class="stop-btn" id="stopBtn">■</button>
    <div class="playing-info"><span id="playingPad">—</span> ready</div>
    <div class="tap-hint" id="tapHint">TAP TO PLAY</div>
  </div>
</div>

<!-- DJ VIEW -->
<div class="dj-zone" id="djZone" style="display:none">

  <!-- Shown until an audio file is loaded -->
  <div class="dj-upload" id="djUpload">
    <div class="dj-drop-zone" id="djDropZone">
      <div class="dj-upload-icon">♫</div>
      <div class="dj-upload-title">DROP AN AUDIO FILE</div>
      <div class="dj-upload-sub">MP3 · WAV · OGG · FLAC · M4A</div>
      <button class="dj-browse-btn" id="djBrowseBtn">BROWSE FILES</button>
      <input type="file" id="djFileInput" accept="audio/*,.m4a" style="display:none">
    </div>
  </div>

  <!-- Shown after file is decoded -->
  <div class="dj-wheel-area" id="djWheelArea" style="display:none">
    <div class="dj-wheel-wrap">
      <canvas class="dj-canvas" id="djCanvas"></canvas>
    </div>
    <div class="dj-transport">
      <span class="dj-time" id="djCurrentTime">0:00</span>
      <button class="dj-play-btn" id="djPlayBtn">▶</button>
      <span class="dj-time dj-time-total" id="djTotalTime">0:00</span>
    </div>
  </div>

</div>

<!-- Hidden YouTube player -->
<div id="yt-container"><div id="player"></div></div>

<!-- Editor bottom sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="editorSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">
      <div class="sheet-pad-badge" id="sheetPadBadge">P01</div>
      <div class="sheet-pad-name">Sample Point</div>
    </div>
    <div class="sheet-close" id="sheetClose">×</div>
  </div>

  <div class="timeline-section">
    <div class="timeline-label">
      <span>SONG TIMELINE — DRAG TO SET POINT</span>
      <span id="sheetTotalTime">0:00</span>
    </div>
    <div class="timeline-wrap" id="timelineWrap">
      <canvas class="waveform-canvas" id="waveCanvas"></canvas>
      <div class="scrubber-region" id="scrubberRegion"></div>
      <div class="scrubber-thumb" id="scrubberThumb"></div>
    </div>
    <div class="timeline-time" id="scrubberTime">0:00</div>
  </div>

  <div class="fine-tune">
    <span class="fine-section-label">START</span>
    <button class="fine-btn accent" id="nudgeMinus5">−5s</button>
    <button class="fine-btn accent" id="nudgeMinus1">−1s</button>
    <button class="fine-btn accent" id="nudgeMinus01">−0.1s</button>
    <div class="fine-spacer"></div>
    <button class="fine-btn accent" id="nudgePlus01">+0.1s</button>
    <button class="fine-btn accent" id="nudgePlus1">+1s</button>
    <button class="fine-btn accent" id="nudgePlus5">+5s</button>
  </div>

  <div class="fine-tune dur-tune">
    <span class="fine-section-label">DUR</span>
    <button class="fine-btn accent" id="durMinus1">−1s</button>
    <button class="fine-btn accent" id="durMinus05">−0.5s</button>
    <button class="fine-btn accent" id="durMinus01">−0.1s</button>
    <div class="fine-spacer"></div>
    <span class="editor-dur-val" id="editorDurVal">2.0s</span>
    <div class="fine-spacer"></div>
    <button class="fine-btn accent" id="durPlus01">+0.1s</button>
    <button class="fine-btn accent" id="durPlus05">+0.5s</button>
    <button class="fine-btn accent" id="durPlus1">+1s</button>
  </div>

  <div class="sheet-actions">
    <button class="preview-btn" id="previewBtn">▶ PREVIEW</button>
    <button class="confirm-btn" id="confirmBtn">✓ SET POINT</button>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loader"></div>
  <div class="loader-text" id="loaderText">LOADING...</div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
